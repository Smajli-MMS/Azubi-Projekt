# Host Nginx: /etc/nginx/conf.d/relin.conf (not the container Nginx config).
# Remove default_server from the old sites-available/default port-80 listeners
# before enabling this file. Keep any existing HTTPS configuration separately.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
