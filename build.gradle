plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'xcc.mediamarktsaturn'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


subprojects {
    apply plugin: "java"
    apply plugin: "io.spring.dependency-management"

    repositories {
        mavenCentral()
    }

    pluginManager.withPlugin("java") {
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter'
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
            implementation 'org.flywaydb:flyway-core'
            implementation 'org.flywaydb:flyway-database-postgresql'
            runtimeOnly 'org.postgresql:postgresql'
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'org.springframework.boot:spring-boot-testcontainers'
            testImplementation 'org.assertj:assertj-core'
            testImplementation 'org.testcontainers:postgresql'
            testImplementation 'org.testcontainers:junit-jupiter'
            testImplementation 'com.h2database:h2'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()

    // Test-Profile setzen
    systemProperty 'spring.profiles.active', 'unittest'

    // Flyway für Tests deaktivieren
    systemProperty 'spring.flyway.enabled', 'false'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

task dbTest(type: Test) {
    useJUnitPlatform()
    include '**/*IntegrationTest*'
    include '**/*Tests*'  // ✅ Diese Zeile hinzufügen

    systemProperty 'spring.profiles.active', 'unittest'
    systemProperty 'spring.flyway.enabled', 'false'

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}
