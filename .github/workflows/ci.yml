name: Backend CI

# Check main and pull requests; publish stable versions on tag pushes.
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: OpenAPI, Build und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Versions-Tag prüfen
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          # Release policy: stable MAJOR.MINOR.PATCH only, without a v prefix.
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Ungültiger Versions-Tag: $GITHUB_REF_NAME"
            echo "Erwartet wird eine stabile Version wie 1.0.0 (ohne v, Vorabversion oder Build-Metadaten)."
            exit 1
          fi
          if (( ${#GITHUB_REF_NAME} > 128 )); then
            echo "Der Versions-Tag überschreitet die Docker-Grenze von 128 Zeichen."
            exit 1
          fi

      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Automatischen Backend- und Frontend-Updater testen
        run: python3 -m unittest discover -s tests -v

      - name: Gemeinsame Compose-Konfiguration prüfen
        env:
          POSTGRES_PASSWORD: configuration-check-only
          BACKEND_TAG: '1.0.0'
          FRONTEND_TAG: '1.0.0'
        run: docker compose --env-file .env.compose.example config --quiet

      - name: Host-Nginx-Konfiguration prüfen
        run: docker run --rm -v "$PWD/deploy/nginx/relin.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: OpenAPI-Spezifikation validieren
        run: bash ./gradlew --no-daemon --console=plain :azubi-api:openApiValidate

      # compileJava generates the OpenAPI interfaces/DTOs automatically.
      # bash also works when gradlew was committed from Windows without +x.
      - name: Alle Module bauen und Tests ausführen
        run: bash ./gradlew --no-daemon --console=plain build

      # Publish only after successful checks on a valid version tag push.
      - name: Docker Buildx einrichten
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub anmelden
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker-Image bauen und veröffentlichen
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/azubi-projekt:${{ github.ref_name }}
