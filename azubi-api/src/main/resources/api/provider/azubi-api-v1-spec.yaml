openapi: 3.0.3
info:
  title: Azubi Market API
  version: 1.0.0
tags:
- name: Markets
- name: Products
- name: Stock
paths:
  /api/markets:
    get:
      tags:
      - Markets
      operationId: getAllMarkets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketApiResponse'
  /api/markets/{marketId}:
    get:
      tags:
      - Markets
      operationId: getMarketById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketApiResponse'
        '404':
          description: Not found
      parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/markets/{marketId}/products:
    get:
      tags:
      - Markets
      operationId: getProductsByMarket
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductWithMarketStock'
      parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/markets/{marketId}/products/available:
    get:
      tags:
      - Markets
      operationId: getAvailableProductsByMarket
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductWithMarketStock'
      parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/markets/overview:
    get:
      tags:
      - Markets
      operationId: getMarketsOverview
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketOverview'
  /api/markets/products/{productId}:
    get:
      tags:
      - Markets
      operationId: getProductStockInAllMarkets
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStockInAllMarkets'
        '404':
          description: Not found
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/markets/{marketId}/stock/{productId}:
    get:
      tags:
      - Markets
      operationId: getSpecificStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: integer
                format: int32
      parameters:
      - name: marketId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/products:
    get:
      tags:
      - Products
      operationId: getAllProducts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductApi'
    post:
      tags:
      - Products
      operationId: createProduct
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductApi'
        '400':
          description: Invalid request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductApi'
  /api/products/{id}:
    get:
      tags:
      - Products
      operationId: getProductById
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductApi'
        '404':
          description: Not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
    put:
      tags:
      - Products
      operationId: updateProduct
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductApi'
        '404':
          description: Not found
        '400':
          description: Invalid request
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductApiRequest'
    delete:
      tags:
      - Products
      operationId: deleteProduct
      responses:
        '200':
          description: Success
        '404':
          description: Not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/products/{id}/stock:
    get:
      tags:
      - Products
      operationId: getProductStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductStockResponse'
        '404':
          description: Not found
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/products/with-stock:
    get:
      tags:
      - Products
      operationId: getAllProductsWithStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductApi'
  /api/stock:
    get:
      tags:
      - Stock
      operationId: getAllStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockApiResponse'
  /api/stock/{productId}:
    get:
      tags:
      - Stock
      operationId: getStockByProductId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockApiResponse'
        '404':
          description: Not found
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int32
  /api/stock/low-stock:
    get:
      tags:
      - Stock
      operationId: getLowStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockApiResponse'
      parameters:
      - name: threshold
        in: query
        schema:
          type: integer
          format: int32
          default: 10
  /api/stock/available:
    get:
      tags:
      - Stock
      operationId: getAvailableStock
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockApiResponse'
components:
  schemas:
    MarketApiResponse:
      type: object
      properties:
        marketId:
          type: integer
          format: int32
        marketName:
          type: string
        location:
          type: string
        postalCode:
          type: string
    ProductWithMarketStock:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        name:
          type: string
        price:
          type: number
        productGroupId:
          type: integer
          format: int32
        stock:
          type: integer
          format: int32
        marketName:
          type: string
        marketId:
          type: integer
          format: int32
    MarketOverview:
      type: object
      properties:
        marketId:
          type: integer
          format: int32
        marketName:
          type: string
        location:
          type: string
        postalCode:
          type: string
        availableProducts:
          type: integer
          format: int32
        totalStock:
          type: integer
          format: int32
    MarketAvailability:
      type: object
      properties:
        marketId:
          type: integer
          format: int32
        marketName:
          type: string
        location:
          type: string
        stock:
          type: integer
          format: int32
        available:
          type: boolean
    ProductStockInAllMarkets:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        productName:
          type: string
        price:
          type: number
        totalStock:
          type: integer
          format: int32
        availableInMarkets:
          type: array
          items:
            $ref: '#/components/schemas/MarketAvailability'
    ProductApi:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        articleNumber:
          type: string
        name:
          type: string
        productGroupId:
          type: integer
          format: int32
        price:
          type: number
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        stockQuantity:
          type: integer
          format: int32
        stockLastChange:
          type: string
          format: date-time
        stockStatus:
          type: string
    UpdateProductApiRequest:
      type: object
      properties:
        name:
          type: string
        productGroupId:
          type: integer
          format: int32
        price:
          type: number
    ProductStockResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        productName:
          type: string
        stock:
          type: integer
          format: int32
        lastChange:
          type: string
          format: date-time
    StockApiResponse:
      type: object
      properties:
        productId:
          type: integer
          format: int32
        stock:
          type: integer
          format: int32
        lastChange:
          type: string
          format: date-time
