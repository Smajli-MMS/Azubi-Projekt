plugins {
    id 'java'
    id 'org.springframework.boot'
}

group = 'xcc.mediamarktsaturn'
version = '1.0-SNAPSHOT'

springBoot {
    mainClass = 'com.mediamarktsaturn.azubi.RelinApplication'
}

tasks.named('bootJar') {
    archiveFileName = 'relin.jar'
}

// Only the executable Boot JAR is useful for this application module.
tasks.named('jar') {
    enabled = false
}

repositories {
    mavenCentral()
}

dependencies {

    implementation project(":azubi-core")
    implementation project(":azubi-infrastructure")
    implementation project(":azubi-api")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
